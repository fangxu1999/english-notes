<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My English Notes | 英语口语与场景笔记</title>
    <style>
      :root {
        --bg: #f8fafc;
        --card-bg: #ffffff;
        --text-main: #0f172a;
        --text-sub: #475569;
        --text-muted: #94a3b8;
        --primary: #2563eb;
        --primary-light: #eff6ff;
        --border: #e2e8f0;
        --accent-green: #10b981;
        --accent-amber: #f59e0b;
        --accent-purple: #8b5cf6;
        --shadow:
          0 1px 3px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f172a;
          --card-bg: #1e293b;
          --text-main: #f1f5f9;
          --text-sub: #cbd5e1;
          --text-muted: #64748b;
          --primary: #60a5fa;
          --primary-light: rgba(59, 130, 246, 0.15);
          --border: #334155;
          --shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
        }
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC",
          "Microsoft YaHei", sans-serif;
        background-color: var(--bg);
        color: var(--text-main);
        line-height: 1.6;
        padding-bottom: 4rem;
      }

      header {
        background: var(--card-bg);
        border-bottom: 1px solid var(--border);
        padding: 1.75rem 1.25rem 1.25rem;
        position: sticky;
        top: 0;
        z-index: 10;
      }

      .container {
        max-width: 1040px;
        margin: 0 auto;
        padding: 0 1.25rem;
      }

      .header-top {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        margin-bottom: 1.1rem;
      }

      h1 {
        font-size: 1.45rem;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .subtitle {
        font-size: 0.85rem;
        color: var(--text-sub);
      }

      .search-box {
        position: relative;
        width: 100%;
        max-width: 280px;
      }

      .search-box input {
        width: 100%;
        padding: 0.5rem 0.9rem;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--bg);
        color: var(--text-main);
        font-size: 0.9rem;
        outline: none;
        transition: border-color 0.2s;
      }

      .search-box input:focus {
        border-color: var(--primary);
      }

      .filters {
        display: flex;
        gap: 0.5rem;
        overflow-x: auto;
        padding-bottom: 0.25rem;
      }

      .filter-btn {
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--text-sub);
        padding: 0.35rem 0.85rem;
        border-radius: 999px;
        font-size: 0.85rem;
        cursor: pointer;
        white-space: nowrap;
        transition: all 0.15s;
      }

      .filter-btn:hover {
        border-color: var(--primary);
        color: var(--primary);
      }

      .filter-btn.active {
        background: var(--primary);
        border-color: var(--primary);
        color: #ffffff;
        font-weight: 500;
      }

      main {
        margin-top: 1.75rem;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(440px, 1fr));
        gap: 1.25rem;
        align-items: start;
      }

      @media (max-width: 520px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }

      .card {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 1.35rem;
        box-shadow: var(--shadow);
        display: flex;
        flex-direction: column;
        gap: 0.9rem;
      }

      .card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px dashed var(--border);
        padding-bottom: 0.7rem;
        gap: 0.5rem;
      }

      .card-title {
        font-size: 1.08rem;
        font-weight: 650;
        color: var(--primary);
      }

      .badge {
        font-size: 0.75rem;
        padding: 0.2rem 0.55rem;
        border-radius: 6px;
        background: var(--primary-light);
        color: var(--primary);
        font-weight: 500;
        white-space: nowrap;
      }

      /* 句型列表样式 */
      .phrase-list {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 0.7rem;
      }

      .phrase-item {
        padding: 0.65rem 0.8rem;
        border-radius: 8px;
        background: var(--bg);
      }

      .phrase-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 0.5rem;
      }

      .en-text {
        font-size: 0.98rem;
        font-weight: 500;
        color: var(--text-main);
      }

      .speak-btn {
        background: none;
        border: none;
        cursor: pointer;
        color: var(--text-muted);
        padding: 0.1rem 0.35rem;
        border-radius: 6px;
        font-size: 0.9rem;
        flex-shrink: 0;
        transition: all 0.15s;
      }

      .speak-btn:hover {
        background: var(--primary-light);
        color: var(--primary);
      }

      .zh-text {
        font-size: 0.85rem;
        color: var(--text-sub);
        margin-top: 0.2rem;
      }

      .note-tag {
        display: inline-block;
        margin-top: 0.35rem;
        font-size: 0.76rem;
        color: var(--accent-amber);
        background: rgba(245, 158, 11, 0.12);
        padding: 0.1rem 0.5rem;
        border-radius: 4px;
      }

      /* 词汇分组芯片样式（用于情绪分级、食物口感） */
      .vocab-group {
        background: var(--bg);
        border-radius: 8px;
        padding: 0.75rem 0.85rem;
      }

      .vocab-group-title {
        font-size: 0.82rem;
        font-weight: 600;
        color: var(--text-sub);
        margin-bottom: 0.55rem;
        display: flex;
        justify-content: space-between;
      }

      .word-pills {
        display: flex;
        flex-wrap: wrap;
        gap: 0.45rem;
      }

      .word-pill {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        background: var(--card-bg);
        border: 1px solid var(--border);
        padding: 0.3rem 0.6rem;
        border-radius: 6px;
        font-size: 0.88rem;
        cursor: pointer;
        transition: all 0.15s;
      }

      .word-pill:hover {
        border-color: var(--primary);
        background: var(--primary-light);
      }

      .word-pill strong {
        color: var(--text-main);
        font-weight: 600;
      }

      .word-pill span {
        color: var(--text-sub);
        font-size: 0.8rem;
      }

      .empty-state {
        text-align: center;
        padding: 3rem 1rem;
        color: var(--text-muted);
        display: none;
      }
    </style>
  </head>

            {

        },
        {
          category: "饮食与购物",
          title: "Describing Food & Taste",
          tag: "评价口味与口感",
          type: "phrases",
          items: [
            {
              en: "It's delicious. / It tastes so good.",

      let currentCategory = "全部";
      let searchQuery = "";

      const filterBar = document.getElementById("filterBar");
      const notesGrid = document.getElementById("notesGrid");
      const emptyState = document.getElementById("emptyState");
      const searchInput = document.getElementById("searchInput");

      function speakText(text) {
        if (!("speechSynthesis" in window)) {
          alert("当前浏览器不支持语音朗读功能。");
          return;
        }
        window.speechSynthesis.cancel();
        const cleanText = text
          .replace(/^\d+\.\s*/, "")
          .replace(/\[Name\]/gi, "Sarah");
        const utterance = new SpeechSynthesisUtterance(cleanText);
        utterance.lang = "en-US";
        utterance.rate = 0.92;
        window.speechSynthesis.speak(utterance);
      }

      function renderFilters() {
        const categories = [
          "全部",
          ...new Set(NOTES_DATA.map((n) => n.category)),
        ];
        filterBar.innerHTML = categories
          .map(
            (cat) => `
        <button class="filter-btn ${cat === currentCategory ? "active" : ""}" data-cat="${cat}">
          ${cat}
        </button>
      `,
          )
          .join("");

        filterBar.querySelectorAll(".filter-btn").forEach((btn) => {
          btn.addEventListener("click", () => {
            currentCategory = btn.dataset.cat;
            renderFilters();
            renderCards();
          });
        });
      }

      function renderCards() {
        const q = searchQuery.trim().toLowerCase();
        let html = "";
        let count = 0;

        NOTES_DATA.forEach((group) => {
          if (currentCategory !== "全部" && group.category !== currentCategory)
            return;

          const filteredItems = (group.items || []).filter((item) => {
            if (!q) return true;
            return (
              item.en.toLowerCase().includes(q) ||
              item.zh.toLowerCase().includes(q) ||
              (item.note && item.note.toLowerCase().includes(q)) ||
              group.title.toLowerCase().includes(q)
            );
          });

          const filteredVocabGroups = (group.vocabGroups || [])
            .map((vg) => {
              const matchedWords = vg.words.filter((w) => {
                if (!q) return true;
                return (
                  w.en.toLowerCase().includes(q) ||
                  w.zh.toLowerCase().includes(q) ||
                  vg.label.toLowerCase().includes(q) ||
                  group.title.toLowerCase().includes(q)
                );
              });
              return { ...vg, words: matchedWords };
            })
            .filter((vg) => vg.words.length > 0);

          if (filteredItems.length === 0 && filteredVocabGroups.length === 0)
            return;
          count++;

          const itemsHtml =
            filteredItems.length > 0
              ? `
          <ul class="phrase-list">
            ${filteredItems
              .map(
                (item) => `
              <li class="phrase-item">
                <div class="phrase-top">
                  <span class="en-text">${item.en}</span>
                  <button class="speak-btn" title="点击朗读" onclick="speakText('${item.en.replace(/'/g, "\\'")}')">🔊</button>
                </div>
                <div class="zh-text">${item.zh}</div>
                ${item.note ? `<span class="note-tag">${item.note}</span>` : ""}
              </li>
            `,
              )
              .join("")}
          </ul>
        `
              : "";

          const vocabHtml = filteredVocabGroups
            .map(
              (vg) => `
          <div class="vocab-group">
            <div class="vocab-group-title">
              <span>${vg.label}</span>
            </div>
            <div class="word-pills">
              ${vg.words
                .map(
                  (w) => `
                <button class="word-pill" title="点击朗读 ${w.en}" onclick="speakText('${w.en.replace(/'/g, "\\'")}')">
                  <strong>${w.en}</strong>
                  <span>${w.zh}</span>
                  <span>🔊</span>
                </button>
              `,
                )
                .join("")}
            </div>
          </div>
        `,
            )
            .join("");

          html += `
          <section class="card">
            <div class="card-header">
              <h2 class="card-title">${group.title}</h2>
              <span class="badge">${group.tag}</span>
            </div>
            ${itemsHtml}
            ${vocabHtml}
          </section>
        `;
        });

        notesGrid.innerHTML = html;
        emptyState.style.display = count === 0 ? "block" : "none";
      }

      searchInput.addEventListener("input", (e) => {
        searchQuery = e.target.value;
        renderCards();
      });

      renderFilters();
      renderCards();
    </script>
  </body>
</html>
